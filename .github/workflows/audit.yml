name: audit

# Split out of the `rust` workflow so its trigger can be narrowed without
# also suppressing fmt/clippy/coverage. Gated on branch rather than on paths:
# cargo-audit resolves Cargo.lock against the *current* RustSec advisory
# database, so its result changes even when nothing in the repo does. A paths
# filter on Cargo.lock would only re-check when the lockfile moves, leaving a
# newly published advisory against an existing dependency undetected until the
# next dependency bump — potentially months. Running on every push to main
# re-checks the whole set regularly, at the cost of one runner per merge.
#
# The deliberate gap: a PR that *adds* a vulnerable dependency is not caught
# until after it merges. That is the price of "only on main"; adding back a
# `pull_request` trigger with `paths: [Cargo.lock]` would close it (and is
# strictly more coverage), or a `schedule:` would cover quiet periods.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs cargo-audit from the flake devshell (pinned via flake.lock):
  # no per-tool setup action, no 3-minute `cargo install` from source,
  # and no Checks-API reporting — `cargo audit` exits non-zero on real
  # vulnerabilities but allows informational warnings (unmaintained/
  # unsound/notice), which is the intended gate.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command cargo audit

permissions:
  contents: read
