name: audit

# Split out of the `rust` workflow so its trigger can be narrowed without
# also suppressing fmt/clippy/coverage. Gated on branch rather than on paths:
# cargo-audit resolves Cargo.lock against the *current* RustSec advisory
# database, so its result changes even when nothing in the repo does. A paths
# filter on Cargo.lock would only re-check when the lockfile moves, leaving a
# newly published advisory against an existing dependency undetected until the
# next dependency bump — potentially months. Running on every push to main
# re-checks the whole set regularly, at the cost of one runner per merge.
#
# The deliberate gap: a PR that *adds* a vulnerable dependency is not caught
# until after it merges. That is the price of "only on main"; adding back a
# `pull_request` trigger with `paths: [Cargo.lock]` would close it (and is
# strictly more coverage), or a `schedule:` would cover quiet periods.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Unlike the jobs in `rust.yml`, this one does not use flake.nix: the action
  # ships its own pinned cargo-audit and queries the advisory DB directly, so
  # there is no devshell to enter and nothing for the Nix cache to warm.
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
