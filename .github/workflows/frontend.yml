name: Frontend

on:
  workflow_call:
    inputs:
      # When false, the build-publish job (frontend build + Chromatic upload
      # + artifact staging) is skipped — lint/check-test still run. Callers
      # pass `publish: true` to opt in (release.yml does so on manual
      # dispatch).
      publish:
        description: "Build and publish the frontend (Chromatic + artifact)"
        required: false
        type: boolean
        default: false
    secrets:
      # Reusable workflows don't automatically receive the caller's
      # secrets (even if they're configured in the repo's Settings) —
      # each one must be explicitly declared here and passed by every
      # caller (see ci.yml/release.yml's `frontend:` job), or
      # `secrets.CHROMATIC_PROJECT_TOKEN` below silently resolves to an
      # empty string instead of erroring loudly.
      CHROMATIC_PROJECT_TOKEN:
        required: true

jobs:
  # Code-quality checks (formatting + lint). The lint step is the slowest
  # (~2m), so it runs in its own job and does not block the build/publish
  # pipeline.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ESLint needs the wasm package's generated types to resolve the `rhizz`
      # import; without them it falls back to `any` and flags no-unsafe-* rules.
      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
          cache-hash: ${{ hashFiles('**/deno.json') }}

      - name: Deno Install
        run: deno install
        working-directory: ./web

      - name: Typescript Formatting check
        run: deno fmt --check
        working-directory: ./web

      - name: Lint Frontend
        run: deno run lint
        working-directory: ./web

  # Type-checking and unit tests, independent of lint and of the build.
  check-test:
    name: check-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
          cache-hash: ${{ hashFiles('**/deno.json') }}

      - name: Deno Install
        run: deno install
        working-directory: ./web

      - name: Svelte Check
        run: deno run check
        working-directory: ./web

      - name: Test Frontend
        run: deno run test --project=unit_tests
        working-directory: ./web

  # Build, publish to Chromatic, and stage the frontend artifact. Depends only
  # on the wasm artifact, not on lint/check/test. Skipped entirely unless the
  # caller opted in via the `publish` input.
  build-publish:
    name: build-publish
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 👇 Tells the checkout which commit hash to reference
          ref: ${{ github.event.pull_request.head.ref }}
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          CHROMATIC_SLUG: ${{ github.repository }}

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
          cache-hash: ${{ hashFiles('**/deno.json') }}

      - name: Deno Install
        run: deno install
        working-directory: ./web

      - name: Build Frontend
        run: deno run build
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Build Storybook
        run: deno run build-storybook
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Upload to Chromatic
        run: deno run chromatic
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Stage frontend artifact
        run: |
          rm -rf pages
          mkdir -p pages/storybook
          cp -a web/build/. pages/
          cp -a web/storybook-static/. pages/storybook/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhizz-web
          path: pages/