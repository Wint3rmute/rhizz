name: Frontend

on:
  workflow_call:
    secrets:
      # Reusable workflows don't automatically receive the caller's
      # secrets (even if they're configured in the repo's Settings) —
      # each one must be explicitly declared here and passed by every
      # caller (see ci.yml/release.yml's `frontend:` job), or
      # `secrets.CHROMATIC_PROJECT_TOKEN` below silently resolves to an
      # empty string instead of erroring loudly.
      CHROMATIC_PROJECT_TOKEN:
        required: true

jobs:
  build-frontend:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 👇 Tells the checkout which commit hash to reference
          ref: ${{ github.event.pull_request.head.ref }}
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          CHROMATIC_SLUG: ${{ github.repository }}

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
          cache-hash: ${{ hashFiles('**/deno.json') }}

      - name: Typescript Formatting check
        run: deno fmt --check
        working-directory: ./web

      - name: Deno Install
        run: deno install
        working-directory: ./web

      - name: Lint Frontend
        run: deno run lint
        working-directory: ./web

      - name: Svelte Check
        run: deno run check
        working-directory: ./web

      - name: Test Frontend
        run: deno run test --project=unit_tests
        working-directory: ./web

      - name: Build Frontend
        run: deno run build
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Build Storybook
        run: deno run build-storybook
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Upload to Chromatic
        run: deno run chromatic
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Stage frontend artifact
        run: |
          rm -rf pages
          mkdir -p pages/storybook
          cp -a web/build/. pages/
          cp -a web/storybook-static/. pages/storybook/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhizz-web
          path: pages/
