name: Frontend

on:
  workflow_call:

jobs:
  build-frontend:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.2
          cache-hash: ${{ hashFiles('**/deno.json') }}

      - name: Typescript Formatting check
        run: deno fmt --check
        working-directory: ./web

      - name: Deno Install
        run: deno install
        working-directory: ./web

      - name: Check Frontend
        run: deno run check
        working-directory: ./web

      - name: Test Frontend
        run: deno run test
        working-directory: ./web

      - name: Build Frontend
        run: deno run build
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Build Storybook
        run: ./node_modules/.bin/storybook build --config-dir .storybook --output-dir storybook-static
        working-directory: ./web
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Stage frontend artifact
        run: |
          rm -rf pages
          mkdir -p pages/storybook
          cp -a web/build/. pages/
          cp -a web/storybook-static/. pages/storybook/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhizz-web
          path: pages/
