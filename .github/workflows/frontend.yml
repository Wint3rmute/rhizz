name: frontend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# All toolchains come from flake.nix (pinned via flake.lock): every job
# installs Nix, warms /nix/store from cache, then runs the same `just`
# recipes and tool commands developers run locally. No per-tool setup
# actions (rust-toolchain, setup-node, mdbook, wasm-pack installer) remain.

jobs:
  # Build the wasm package once, hand it to every job that needs it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix develop --command just wasm

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

  lint:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command npm ci
        working-directory: ./web

      # web/.eslintcache (written by `npm run lint`) is pure derived state:
      # a function of file contents + eslint config + version. It is only
      # reusable across runs with `--cache-strategy content` (the default
      # `metadata` keys on mtime, which a fresh checkout invalidates
      # wholesale) — hence the strategy in the `lint` script. Cold lint of
      # this tree is ~7 min, so restoring it is the difference between that
      # and seconds. Keyed on the inputs that make a restored cache useless:
      # the eslint config plus the npm lockfile / package.json pinning
      # eslint's version. Linted sources are deliberately NOT part of the key
      # — a PR that edits one file should still reuse the other ~170.
      - uses: actions/cache@v4
        with:
          path: web/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('web/eslint.config.js', 'web/package-lock.json', 'web/package.json') }}
          restore-keys: eslint-${{ runner.os }}-

      - run: nix develop --command npm run format:check
        working-directory: ./web

      - run: nix develop --command npm run lint
        working-directory: ./web

      - run: nix develop --command npm run check
        working-directory: ./web

  # Vitest suite (`npm run test`, incl. the Storybook browser project).
  # Split out of `lint` so the long test run doesn't block lint/typecheck.
  # Browsers come from the flake (PLAYWRIGHT_BROWSERS_PATH).
  test:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command npm ci
        working-directory: ./web

      - run: nix develop --command npm run test
        working-directory: ./web

  # Full-app browser tests via @playwright/test (web/e2e). Chromium comes
  # from the flake (PLAYWRIGHT_BROWSERS_PATH); the HTML report + traces are
  # kept as an artifact for post-failure inspection.
  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command npm ci
        working-directory: ./web

      # Fail fast when the installed Playwright driver expects browser
      # revisions absent from the Nix-provided browsers (see flake.nix).
      # Catches both a package.json/flake.lock pin mismatch and a stale
      # web/node_modules resolving an old driver.
      - run: |
          nix develop --command python3 -c '
          import glob, json, os, sys
          match = glob.glob("node_modules/playwright-core/browsers.json")
          expected = set()
          for path in match:
              for b in json.load(open(path))["browsers"]:
                  if b["name"] in ("chromium", "chromium-headless-shell"):
                      expected.add(b["name"].replace("-", "_") + "-" + b["revision"])
          missing = expected - set(os.listdir(os.environ["PLAYWRIGHT_BROWSERS_PATH"]))
          if missing:
              sys.exit("playwright/nix browser mismatch, missing: " + ", ".join(sorted(missing)))
          print("playwright browsers match: " + ", ".join(sorted(expected)))
          '
        working-directory: ./web

      - run: nix develop --command npm run test:e2e
        working-directory: ./web

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/

  # Visual regression tests over every Storybook story (web/vrt). Split out
  # of `e2e` so a story diff doesn't queue behind the full browser suite. The
  # static diff gallery is kept as an artifact for post-failure inspection.
  visual-regressions:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # VRT baselines (web/vrt/__screenshots__/*.png) live in Git LFS.
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command npm ci
        working-directory: ./web

      # The wasm pkg comes from the artifact above, so only Storybook is built
      # here (`vrt-quick` skips the wasm rebuild). No app build: VRT serves
      # storybook-static/ alone (see vrt/serve.ts).
      - run: nix develop --command npm run build-storybook
        working-directory: ./web

      - run: nix develop --command just vrt-quick

      # Static diff gallery: download, unzip, open index.html.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vrt-report
          path: web/vrt-report/
          if-no-files-found: ignore

permissions:
  contents: read
