name: frontend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Toolchains come from flake.nix (pinned via flake.lock): jobs install Nix,
# warm /nix/store from cache, then run either a Nix derivation or a runnable
# task script (`nix run .#<task>`, see nix/tasks.nix) — the same scripts `just`
# runs locally, without entering the devshell. No per-tool setup actions
# (rust-toolchain, setup-node, mdbook, wasm-pack installer) remain.
#
# The two build jobs (`wasm`, `build`) call `nix build` on their derivation
# directly: their recipes need no toolchain, so entering the devshell (or even
# realizing a task closure just to obtain `just`) would only realize its
# ~2.7 GiB of Playwright browsers, clippy, rustfmt and mdbook. The remaining
# jobs use the task scripts, each realizing only the toolchain it needs
# (Node without Rust, and vice versa).

jobs:
  # Build the wasm package once, hand it to every job that needs it.
  #
  # The derivation only — deliberately neither devshell nor `just` wrapper.
  # `just wasm` would work too (it runs the same `nix build` plus the copy
  # tail below), but `just` itself lives in the devshell, so reaching it
  # realizes the whole shared shell first: measured at 1191 paths / ~2.7 GiB
  # more than this derivation needs (Playwright browsers, clippy, rustfmt,
  # mdbook — none of which the wasm build touches). Every command below is
  # base-image coreutils. The same numbers apply to the `build` job.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix build .#rhizome-wasm-pkg

      # Mirrors the tail of `just wasm` (see Justfile): the derivation's
      # output is a read-only store path, so it has to be dereferenced and
      # made writable to land in the tree the artifact upload reads from.
      # Nothing under crates/rhizome-wasm/pkg/ is committed (the pkg ships its
      # own `*` .gitignore, so git hides it), and a fresh checkout has no such
      # directory at all — hence the mkdir rather than a plain copy.
      - run: |
          rm -rf crates/rhizome-wasm/pkg
          mkdir -p crates/rhizome-wasm/pkg
          cp -rL result/. crates/rhizome-wasm/pkg/
          chmod -R u+w crates/rhizome-wasm/pkg

      - uses: actions/upload-artifact@v7
        with:
          name: rhizome-wasm
          path: crates/rhizome-wasm/pkg/

  # The app build, via its Nix derivation (nix/frontend.nix): the same `web/build`
  # rhizome-server's build.rs embeds. This is the only place the real frontend is
  # built in CI — nothing else embeds it, so a broken build here would otherwise
  # only surface in the docker workflow.
  #
  # Runs on its own so a frontend failure is unambiguous, with no Rust
  # toolchain in the way. `needs: wasm` so the shared rhizome-wasm-pkg
  # derivation is a cache hit rather than being built twice in parallel.
  #
  # The derivation only, for the same reason as `wasm` above — the recipe's
  # `web-build` tail only copies the store output into web/build/, which
  # nothing in this job consumes. (`just build` still runs the full recipe
  # locally, where the copy does matter.)
  build:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix build .#rhizome-frontend

  lint:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizome-wasm
          path: crates/rhizome-wasm/pkg/

      - run: nix run .#install-web

      # web/.eslintcache (written by `npm run lint`) is pure derived state:
      # a function of file contents + eslint config + version. It is only
      # reusable across runs with `--cache-strategy content` (the default
      # `metadata` keys on mtime, which a fresh checkout invalidates
      # wholesale) — hence the strategy in the `lint` script. Cold lint of
      # this tree is ~7 min, so restoring it is the difference between that
      # and seconds. Keyed on the inputs that make a restored cache useless:
      # the eslint config plus the npm lockfile / package.json pinning
      # eslint's version. Linted sources are deliberately NOT part of the key
      # — a PR that edits one file should still reuse the other ~170.
      - uses: actions/cache@v4
        with:
          path: web/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('web/eslint.config.js', 'web/package-lock.json', 'web/package.json') }}
          restore-keys: eslint-${{ runner.os }}-

      # `lint-frontend` covers sync + format:check + eslint + svelte-check,
      # with only the Node toolchain.
      - run: nix run .#lint-frontend

  # Vitest suite (`npm run test`, incl. the Storybook browser project).
  # Split out of `lint` so the long test run doesn't block lint/typecheck.
  # Browsers come from the flake (PLAYWRIGHT_BROWSERS_PATH).
  test:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizome-wasm
          path: crates/rhizome-wasm/pkg/

      - run: nix run .#install-web

      - run: nix run .#test-web

  # Full-app browser tests via @playwright/test (web/e2e). Chromium comes
  # from the flake (PLAYWRIGHT_BROWSERS_PATH); the HTML report + traces are
  # kept as an artifact for post-failure inspection.
  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizome-wasm
          path: crates/rhizome-wasm/pkg/

      - run: nix run .#install-web

      # `test-e2e` starts with a browser-revision preflight (fail fast on a
      # package.json/flake.lock pin mismatch or a stale node_modules), then
      # runs the full @playwright/test suite.
      - run: nix run .#test-e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/

  # Visual regression tests over every Storybook story (web/vrt). Split out
  # of `e2e` so a story diff doesn't queue behind the full browser suite. The
  # static diff gallery is kept as an artifact for post-failure inspection.
  # Also runs `just assets` right after and fails if it changes anything.
  visual-regressions:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # VRT baselines (web/vrt/__screenshots__/*.png) live in Git LFS.
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizome-wasm
          path: crates/rhizome-wasm/pkg/

      - run: nix run .#install-web

      # The wasm pkg comes from the artifact above. `vrt` builds Storybook
      # itself, then runs every story screenshot. No app build: VRT serves
      # storybook-static/ alone (see vrt/serve.ts).
      - run: nix run .#vrt

      # Generated graphics (landing hero from the VRT landing screenshot, logo
      # SVGs, favicons, social preview) must match what `just assets` produces:
      # regenerate them and fail if anything in the repo changed (modified or
      # new files). Lives here because this job already has the LFS screenshots
      # the hero is built from.
      - name: Regenerate assets and fail on any repo change
        run: |
          nix run .#assets
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated assets are out of date. Run 'just assets' and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi

      # Static diff gallery: download, unzip, open index.html.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vrt-report
          path: web/vrt-report/
          if-no-files-found: ignore

permissions:
  contents: read
