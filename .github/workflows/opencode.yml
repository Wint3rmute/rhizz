name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Same toolchain the other jobs use: install Nix and warm /nix/store
      # from cache. Upstream Nix (determinate: false) skips the FlakeHub
      # login, which this repo never uses.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The Justfile wraps every recipe in `nix develop --command` whenever
      # Nix is present, so exposing the devshell's PATH is enough: `just`,
      # `cargo`, `deno`, … resolve, and the shell hook (Playwright browsers,
      # LLVM tools, VRT fonts) is re-applied per recipe. GITHUB_PATH expects
      # one path per line, hence the `tr`.
      - name: Put the flake devshell on PATH
        run: nix develop --command bash -c 'echo "$PATH" | tr ":" "\n" >> "$GITHUB_PATH"'

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/~deepseek/deepseek-flash-latest
