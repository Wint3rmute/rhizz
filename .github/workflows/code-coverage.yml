# Rust unit-test coverage, produced by cargo-tarpaulin.
#
# - Generates a Cobertura XML report (--out xml) and keeps the raw lcov
#   report as a rust-coverage artifact.
# - GATES on line coverage: --fail-under 80 fails the job (and thus any
#   pull request that runs it) when coverage drops below 80%.
# - Runs on pushes to the default branch (baseline) and on pull requests so
#   the gate actually blocks PRs — the per-PR instrumented rebuild is the
#   accepted cost of a coverage gate.
# - The native-upload step (GitHub Code Quality) stays commented out: the
#   feature is in beta and not yet available to this repository. When it
#   arrives, enable it — it needs `code-quality: write` permission (kept in
#   the permissions block below) and the Cobertura report this job produces.
name: code-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      # Check out the PR head commit (not the merge commit) so coverage and
      # any future per-file diff reporting map line numbers to the diff.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Pinned to the same version as the nix dev shell (pkgs.cargo-tarpaulin)
      # so local and CI numbers match. --locked is not usable: the published
      # crate does not carry a Cargo.lock.
      - run: cargo install cargo-tarpaulin --version 0.37.2

      # Same flags as `just coverage`, plus the 80% gate; rhizz-wasm is
      # excluded (no host tests) and crates/*/tests are not counted as source.
      # --out xml produces the Cobertura report the upload step would consume
      # once GitHub's native coverage (Code Quality) reaches this repository.
      - run: cargo tarpaulin --workspace -e rhizz-wasm --exclude-files 'crates/*/tests/*' --out lcov --out xml --fail-under 80 --output-dir target/coverage

      # GitHub's native code coverage (Code Quality) is in beta and has not
      # rolled out to this repository yet, so uploading is disabled for now.
      # When Settings > Security > Code quality becomes available and is
      # enabled, re-enable the upload step; it needs `code-quality: write`
      # permission (see the permissions block above).
      # - name: Upload coverage report
      #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      #   uses: actions/upload-code-coverage@v1
      #   with:
      #     file: target/coverage/cobertura.xml
      #     language: Rust
      #     label: code-coverage/rust

      # Raw lcov report kept for humans who want the data outside GitHub's UI.
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/lcov.info