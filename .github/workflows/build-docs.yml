name: Build Documentation

on:
  workflow_call:

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --no-deps --all

      - name: Add redirect to root index
        run: |
          echo '<meta http-equiv="refresh" content="0; url=rhizz_core/index.html">' \
            > target/doc/index.html

      - name: Stage docs artifact contents
        run: |
          mkdir -p docs-artifact
          cp -a target/doc/. docs-artifact/

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhizz-docs
          path: docs-artifact/
