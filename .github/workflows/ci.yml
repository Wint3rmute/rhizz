name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the wasm package once, hand it to every job that needs it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: wasm-pack build crates/rhizz-wasm --target web --release

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      # No separate `cargo test` step: the coverage run below executes the
      # identical test suite (unit + integration; doctests are absent from
      # all host crates) under instrumentation, fails on test failures, and
      # enforces the gate — one test run, one place. cargo-llvm-cov is
      # installed via prebuilt binary (same version locally via nixpkgs).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Single instrumented pass: runs all tests (incl. doctests) + writes
      # lcov + enforces the 80% line-coverage gate. rhizz-wasm is excluded
      # (wasm cdylib, no host tests) and crates/*/tests are not counted as
      # source. --doctests is unstable, hence RUSTC_BOOTSTRAP=1; the cobertura
      # report is generated from the same saved data (no re-test) for when
      # GitHub's native Code Quality upload (beta) becomes available.
      - name: Rust coverage (llvm-cov)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --all-features --exclude rhizz-wasm --ignore-filename-regex 'crates/.*/tests/' --doctests --fail-under-lines 80 --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report -p rhizz-core -p rhizz-cli -p rhizz-server -p rhizz-book --ignore-filename-regex 'crates/.*/tests/' --cobertura --output-path target/coverage/cobertura.xml

      # Raw lcov report kept for humans who want the data outside the log.
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/lcov.info

      - run: cargo build --release --quiet

  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v6

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Builds the mdBook with the current compiler and verifies that the
  # compiled ```rhizz blocks still match book/book.lock. Any drift in the
  # book's examples or the compiler's diagnostics fails this job.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
          # The Rust preprocessor (crates/rhizz-book) is spawned via
          # `cargo run`; pre-building keeps its probe/run fast. The compiler
          # runs in-process, so no rhizz binary is needed here.
      - run: cargo build --bin rhizz-book --quiet

      - run: mdbook build book

      - run: |
          rm -rf book-artifact
          mkdir -p book-artifact
          cp -a book/target-mdbook/. book-artifact/

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-book
          path: book-artifact/

  frontend:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - run: deno install
        working-directory: ./web

      - run: deno fmt --check
        working-directory: ./web

      - run: deno run lint
        working-directory: ./web

      - run: deno run check
        working-directory: ./web

      - run: deno run test --project=unit_tests
        working-directory: ./web

  # Build the frontend for Chromatic + GitHub Pages. Runs only for a
  # "chromatic" push/PR title or a manual dispatch.
  publish:
    needs: wasm
    if: ${{ github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chromatic')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'chromatic')) }}
    runs-on: ubuntu-latest
    env:
      BASE_PATH: "/${{ github.event.repository.name }}"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - run: deno install
        working-directory: ./web

      - run: deno run build
        working-directory: ./web

      - run: deno run build-storybook
        working-directory: ./web

      - run: deno run chromatic
        working-directory: ./web
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - run: |
          rm -rf pages
          mkdir -p pages/storybook
          cp -a web/build/. pages/
          cp -a web/storybook-static/. pages/storybook/

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-web
          path: pages/

  # Docs are only for Pages, not a PR check.
  docs:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo doc --no-deps --all

      - run: echo '<meta http-equiv="refresh" content="0; url=rhizz_core/index.html">' > target/doc/index.html

      - run: |
          mkdir -p docs-artifact
          cp -a target/doc/. docs-artifact/

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-docs
          path: docs-artifact/

  deploy-pages:
    needs: [publish, docs, book]
    # Publish is skipped unless the "chromatic" trigger fires; deploy still
    # runs (docs & book are always deployed) but never after a failed publish
    # or a failed book/docs build.
    if: ${{ github.event_name != 'pull_request' && !cancelled() &&
      needs.publish.result != 'failure' && needs.docs.result == 'success' &&
      needs.book.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-web
          path: pages/
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-docs
          path: pages/docs/

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-book
          path: pages/book/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - uses: actions/deploy-pages@v4
        id: deploy

permissions:
  contents: read
  pages: write
  id-token: write