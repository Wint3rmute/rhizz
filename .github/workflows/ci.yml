name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# All toolchains come from flake.nix (pinned via flake.lock): every job
# installs Nix, warms /nix/store from cache, then runs the same `just`
# recipes and tool commands developers run locally. No per-tool setup
# actions (rust-toolchain, setup-deno, mdbook, wasm-pack installer) remain.

jobs:
  # Build the wasm package once, hand it to every job that needs it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix develop --command just wasm

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Swatinem/rust-cache persists workspace target/, which lives outside
      # /nix/store and is therefore not covered by the Nix cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          cmd-format: nix develop -c {0}

      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings
      # Single instrumented pass: runs all tests (incl. doctests) + writes
      # lcov + enforces the 80% line-coverage gate. rhizz-wasm is excluded
      # (wasm cdylib, no host tests) and crates/*/tests are not counted as
      # source. --doctests is unstable, hence RUSTC_BOOTSTRAP=1; the cobertura
      # report is generated from the same saved data (no re-test) for when
      # GitHub's native Code Quality upload (beta) becomes available.
      - run: nix develop --command just coverage

      # Raw lcov report kept for humans who want the data outside the log.
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/lcov.info

      - run: nix develop --command cargo build --release --quiet

  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Builds the mdBook with the current compiler and verifies that the
  # compiled ```rhizz blocks still match book/book.lock. Any drift in the
  # book's examples or the compiler's diagnostics fails this job.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "book"
          cmd-format: nix develop -c {0}

      - run: nix develop --command just book
      - run: |
          rm -rf book-artifact
          mkdir -p book-artifact
          cp -a book/target-mdbook/. book-artifact/

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-book
          path: book-artifact/

  frontend:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command deno install
        working-directory: ./web

      - run: nix develop --command deno fmt --check
        working-directory: ./web

      - run: nix develop --command deno run lint
        working-directory: ./web

      - run: nix develop --command deno run check
        working-directory: ./web

      # All projects, including the Playwright browser tests (project=
      # storybook); browsers come from the flake (PLAYWRIGHT_BROWSERS_PATH).
      - run: nix develop --command deno run test
        working-directory: ./web

  # Full-app browser tests via @playwright/test (web/e2e), then visual
  # regression tests over every Storybook story (web/vrt). Chromium comes
  # from the flake (PLAYWRIGHT_BROWSERS_PATH); the HTML report + traces and
  # the VRT diff gallery are kept as artifacts for post-failure inspection.
  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # VRT baselines (web/vrt/__screenshots__/*.png) live in Git LFS.
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command deno install
        working-directory: ./web

      # Fail fast when the installed Playwright driver expects browser
      # revisions absent from the Nix-provided browsers (see flake.nix).
      # Catches both a package.json/flake.lock pin mismatch and a stale
      # web/node_modules resolving an old driver.
      - run: |
          nix develop --command python3 -c '
          import glob, json, os, sys
          match = glob.glob("node_modules/.deno/playwright-core@*/node_modules/playwright-core/browsers.json")
          expected = set()
          for path in match:
              for b in json.load(open(path))["browsers"]:
                  if b["name"] in ("chromium", "chromium-headless-shell"):
                      expected.add(b["name"].replace("-", "_") + "-" + b["revision"])
          missing = expected - set(os.listdir(os.environ["PLAYWRIGHT_BROWSERS_PATH"]))
          if missing:
              sys.exit("playwright/nix browser mismatch, missing: " + ", ".join(sorted(missing)))
          print("playwright browsers match: " + ", ".join(sorted(expected)))
          '
        working-directory: ./web

      - run: nix develop --command deno run test:e2e
        working-directory: ./web

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/

      # Visual regression tests. The wasm pkg comes from the artifact above,
      # so only Storybook is built here (`vrt-quick` skips the wasm rebuild).
      - run: nix develop --command deno run build-storybook
        working-directory: ./web

      - run: nix develop --command just vrt-quick

      # Static diff gallery: download, unzip, open index.html.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vrt-report
          path: web/vrt-report/
          if-no-files-found: ignore

  # Build the frontend for Chromatic + GitHub Pages. Runs on every push to
  # main (to keep a Chromatic baseline), or for a "chromatic" push/PR title,
  # or on manual dispatch.
  publish:
    needs: wasm
    if: ${{ github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chromatic')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'chromatic')) }}
    runs-on: ubuntu-latest
    env:
      BASE_PATH: "/${{ github.event.repository.name }}"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-wasm
          path: crates/rhizz-wasm/pkg/

      - run: nix develop --command deno install
        working-directory: ./web

      - run: nix develop --command deno run build
        working-directory: ./web

      - run: nix develop --command deno run build-storybook
        working-directory: ./web

      - run: nix develop --command deno run chromatic
        working-directory: ./web
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - run: |
          rm -rf pages
          mkdir -p pages/storybook
          cp -a web/build/. pages/
          cp -a web/storybook-static/. pages/storybook/

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-web
          path: pages/

  # Docs are only for Pages, not a PR check.
  docs:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "docs"
          cmd-format: nix develop -c {0}

      - run: nix develop --command cargo doc --no-deps --all

      - run: echo '<meta http-equiv="refresh" content="0; url=rhizz_core/index.html">' > target/doc/index.html

      - run: |
          mkdir -p docs-artifact
          cp -a target/doc/. docs-artifact/

      - uses: actions/upload-artifact@v7
        with:
          name: rhizz-docs
          path: docs-artifact/

  deploy-pages:
    needs: [publish, docs, book]
    # Publish is skipped unless the "chromatic" trigger fires; deploy still
    # runs (docs & book are always deployed) but never after a failed publish
    # or a failed book/docs build.
    if: ${{ github.event_name != 'pull_request' && !cancelled() &&
      needs.publish.result != 'failure' && needs.docs.result == 'success' &&
      needs.book.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rhizz-web
          path: pages/
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-docs
          path: pages/docs/

      - uses: actions/download-artifact@v8
        with:
          name: rhizz-book
          path: pages/book/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - uses: actions/deploy-pages@v4
        id: deploy

permissions:
  contents: read
  pages: write
  id-token: write
