name: rust

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# All toolchains come from flake.nix (pinned via flake.lock): every job
# installs Nix, warms /nix/store from cache, then runs either a Nix derivation
# or the same `just` recipes and tool commands developers run locally. No
# per-tool setup actions (rust-toolchain, setup-node, mdbook, wasm-pack
# installer) remain.

jobs:
  # Was `rust` in the old monolithic workflow; renamed to avoid the
  # `rust / rust` stutter now that the workflow carries the prefix.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Swatinem/rust-cache persists workspace target/, which lives outside
      # /nix/store and is therefore not covered by the Nix cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          cmd-format: nix develop -c {0}

      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings
      # Single instrumented pass: runs all tests (incl. doctests) + writes
      # lcov + enforces the 80% line-coverage gate. rhizz-wasm is excluded
      # (wasm cdylib, no host tests) and crates/*/tests are not counted as
      # source. --doctests is unstable, hence RUSTC_BOOTSTRAP=1; the cobertura
      # report is generated from the same saved data (no re-test) for when
      # GitHub's native Code Quality upload (beta) becomes available.
      - run: nix develop --command just coverage

      # Raw lcov report kept for humans who want the data outside the log.
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/lcov.info

      # The production server goes through its Nix derivation (nix/rhizz.nix),
      # which runs the whole pipeline: rhizz-wasm-pkg → rhizz-web → rhizz.
      # This replaces the devshell's `cargo build --release`, which had no
      # frontend to embed (web/build is gitignored and this job has no Node
      # toolchain), so it only ever produced the placeholder shell page — the
      # release build was never actually verified. No devshell here: the
      # derivation brings its own toolchain.
      - run: nix build .#rhizz

# The `audit` job moved to its own workflow (audit.yml) so it can be gated on
# Cargo.lock changes — a path filter applies to a whole workflow, not to a
# single job, and narrowing this one would have suppressed the checks above.

permissions:
  contents: read
