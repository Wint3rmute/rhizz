name: rust

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# All toolchains come from flake.nix (pinned via flake.lock): every job
# installs Nix, warms /nix/store from cache, then runs either a Nix derivation
# or a runnable task script (`nix run .#<task>`, see nix/tasks.nix) — the same
# scripts `just` runs locally, without entering the devshell. No per-tool
# setup actions (rust-toolchain, setup-node, mdbook, wasm-pack installer)
# remain.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Swatinem/rust-cache persists workspace target/, which lives outside
      # /nix/store and is therefore not covered by the Nix cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          cmd-format: nix develop -c {0}

      # `lint-rust` covers fmt --check + clippy + cargo doc, each with only
      # the Rust toolchain (no Node/browsers/mdbook).
      - run: nix run .#lint-rust
      # Single instrumented pass: runs all tests (incl. doctests) + writes
      # lcov + enforces the 80% line-coverage gate. rhizome-wasm is excluded
      # (wasm cdylib, no host tests) and crates/*/tests are not counted as
      # source. --doctests is unstable, hence RUSTC_BOOTSTRAP=1; the cobertura
      # report is generated from the same saved data (no re-test) for when
      # GitHub's native Code Quality upload (beta) becomes available.
      - run: nix run .#coverage

      # Raw lcov report kept for humans who want the data outside the log.
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/lcov.info

  # Builds the production server through its Nix derivation (nix/backend.nix),
  # which runs the whole pipeline: rhizome-wasm-pkg → rhizome-frontend →
  # rhizome-server (with the frontend embedded). The derivation brings its own
  # toolchain, so there is no devshell. It builds in the Nix sandbox and never
  # touches the workspace target/, so there is no rust-cache step, only the
  # /nix/store cache.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build .#rhizome-server

permissions:
  contents: read
