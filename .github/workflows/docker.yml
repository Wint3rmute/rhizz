name: docker

# Build the container image via its Nix derivation (nix/docker.nix) and push it
# to GitHub's container registry (ghcr.io).
#
# The derivation replaces the Dockerfile's three stages end to end, so this job
# no longer needs a Docker build context: `nix build .#docker-image` compiles
# the whole pipeline (wasm → frontend → binary → image) and emits a
# docker-archive tarball.
#
# The Dockerfile is still on disk and still used by `fly deploy`: fly.toml
# builds from it, passing VITE_SENTRY_DSN as a build arg that this Nix image
# does not carry. Retiring it, and with it the second image path, is the task's
# remaining step.
#
# TEMPORARY: `build/retire-dockerfile` is listed below so the push is exercised
# before it merges. Drop it once the branch lands — the workflow should then
# build on the default branch only, as it did before.
on:
  push:
    branches: [main, build/retire-dockerfile]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The point of the job: `.#docker-image` consumes the whole pipeline
      # (rhizz-wasm-pkg → rhizz-web → rhizz → image), so a failure in any
      # stage surfaces here. This replaced `docker/build-push-action`, which
      # could only build from a Dockerfile.
      - name: Build the image
        run: nix build .#docker-image

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is published from the default branch only, so a
          # feature-branch build can never overwrite what production pulls.
          # The short sha and date stamp are applied to every build, which
          # keeps any pushed image traceable.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value={{ date 'YYYYMMDD-HHmmss' }}

      # The Nix image arrives as a docker-archive tarball whose only tag is the
      # derivation's own name (`rhizz:latest`), so it is loaded first and the
      # metadata tags above are applied by hand — `docker/build-push-action`
      # used to do that from the Dockerfile.
      - name: Load, tag and push the image
        run: |
          docker load -i result
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            docker tag rhizz:latest "$tag"
            docker push "$tag"
          done
