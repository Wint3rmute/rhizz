name: docker

# Build the container image via its Nix derivation (nix/docker.nix) and push it
# to GitHub's container registry (ghcr.io).
#
# The derivation replaces the Dockerfile's three stages end to end, so this job
# no longer needs a Docker build context: `nix build .#rhizz-docker` compiles
# the whole pipeline (wasm → frontend → binary → image) and emits a
# docker-archive tarball.
#
# The `deploy` job then runs `fly deploy --image` on that exact pushed tag, so
# Fly never builds anything itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Cancelling an in-flight build on a newer push is fine; cancelling a
    # deploy is not, so this group lives on the build job, not the workflow.
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix: skips the FlakeHub login (private flakes / binary
          # caches), which this repo never uses — the login's transient
          # failures were stalling every job for 10-15s before continuing
          # anyway. The /nix/store caching (magic-nix-cache-action) is
          # unaffected.
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The point of the job: `.#rhizz-docker` consumes the whole pipeline
      # (rhizz-wasm-pkg → rhizz-frontend → rhizz-server → image), so a failure in any
      # stage surfaces here. This replaced `docker/build-push-action`, which
      # could only build from a Dockerfile.
      - name: Build the image
        run: nix build .#rhizz-docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is published from the default branch only, so a
          # feature-branch build can never overwrite what production pulls.
          # The short sha and date stamp are applied to every build, which
          # keeps any pushed image traceable.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value={{ date 'YYYYMMDD-HHmmss' }}

      # The Nix image arrives as a docker-archive tarball whose only tag is the
      # derivation's own name (`rhizz:latest`), so it is loaded first and the
      # metadata tags above are applied by hand — `docker/build-push-action`
      # used to do that from the Dockerfile.
      - name: Load, tag and push the image
        run: |
          docker load -i result
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            docker tag rhizz:latest "$tag"
            docker push "$tag"
          done

  deploy:
    # Only the default branch deploys: feature-branch builds are pushed for
    # inspection but must never reach production.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Never cancelled once started, even if a newer push queues behind it.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys the image the build job pushed. The `sha-<short>` tag is
      # produced by docker/metadata-action's `type=sha,format=short` rule above.
      # The repository must be lowercased: ghcr and Fly reject uppercase image
      # references (`github.repository` keeps the owner's casing).
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          flyctl deploy --app rhizz --image "$image"
