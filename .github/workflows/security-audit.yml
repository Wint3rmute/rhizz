name: Security Audit

on:
  push:
    branches: [ main, master ]
    paths:
      - Cargo.lock
  pull_request:
    branches: [ main, master ]
    paths:
      - Cargo.lock

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
