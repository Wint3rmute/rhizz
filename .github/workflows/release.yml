name: pages

on:
  push:
    branches: [main, master]
  # Frontend publishing (Chromatic + GitHub Pages deploy) happens only when
  # explicitly requested: push to main with "chromatic" in the (latest)
  # commit message, or run this workflow manually via the Actions tab.
  # Every other push skips the publish job.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  wasm:
    uses: ./.github/workflows/wasm.yml

  frontend:
    needs: wasm
    uses: ./.github/workflows/frontend.yml
    with:
      # The trigger: a push whose (latest) commit message contains
      # "chromatic" (case-sensitive), or a manual dispatch. No other event
      # can publish.
      publish: ${{ github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         contains(github.event.head_commit.message, 'chromatic')) }}
    secrets:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  docs:
    uses: ./.github/workflows/docs.yml

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [frontend, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The frontend artifact only exists when the frontend was published
      # (manual dispatch); on regular pushes only the docs artifact is
      # present.
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-web
          path: pages/
        continue-on-error: true

      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: rhizz-docs
          path: pages/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
