<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Before the theme script below, which has to be able to find and
         rewrite the theme-color tag to avoid a wrong-colour first paint. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D232A" />
    <script>
      // Apply the theme before first paint to avoid flashing the wrong
      // colors. Mirrors the logic in web/src/theme.ts (kept deliberately
      // small and dependency-free): read the stored selection — accepting
      // both the legacy raw format ("dark") and JSON-encoded values —
      // and fall back to the browser's preferred color scheme ("auto").
      (function () {
        try {
          var stored = localStorage.getItem("THEME");
          var value = null;
          if (typeof stored === "string") {
            var trimmed = stored.trim();
            if (trimmed === "auto" || trimmed === "light" || trimmed === "dark") {
              value = trimmed;
            } else {
              try {
                var parsed = JSON.parse(stored);
                if (
                  parsed === "auto" ||
                  parsed === "light" ||
                  parsed === "dark"
                ) {
                  value = parsed;
                }
              } catch (e) {
                /* corrupt stored value — fall through to auto */
              }
            }
          }
          var prefersDark = false;
          if (typeof window.matchMedia === "function") {
            prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;
          }
          var theme =
            value === "light" || value === "dark"
              ? value
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          // Pin the browser's chrome to the page background right here,
          // before first paint: without it the browser infers that colour
          // from painted content and re-infers on every repaint, so the
          // toolbar visibly jumps whenever the viewport repaints. The values
          // are daisyUI's --color-base-100 per theme (see theme.ts's
          // chromeColorFor, which keeps this tag in sync afterwards).
          var chrome = document.querySelector('meta[name="theme-color"]');
          if (chrome) {
            chrome.setAttribute(
              "content",
              theme === "dark" ? "#1D232A" : "#FFFFFF",
            );
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>rhizz</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
