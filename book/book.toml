[book]
title = "The Rhizome language book"
authors = ["Mateusz Bączek"]
language = "en"

[build]
build-dir = "target-mdbook"

[output.html]
# Code highlighting uses mdBook's stock highlight.js bundle.
additional-css = ["css/rhizome.css"]
# Auto-sizes rhizome-project iframes to their content (see js/rhizome-embed.js).
additional-js = ["js/rhizome-embed.js"]

[preprocessor.rhizome]
# cargo walks up from book/ to the workspace root, so no wrapper is needed.
command = "cargo run --release --quiet --bin rhizome-book"
renderer = ["html"]
# Host serving the /book-example route that rhizome-project embeds iframe into.
book-example-base-url = "https://rhizz.fly.dev"

# If you want to test locally:
# book-example-base-url  = "http://localhost:5173"
