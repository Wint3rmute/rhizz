[book]
title = "rhizz"
authors = ["Mateusz Bączek"]
language = "en"

[build]
build-dir = "target-mdbook"

[output.html]
# theme/highlight.js overrides mdBook's default highlight.js bundle with the
# HCL/Terraform grammar (see book/scripts/build-hljs.py); ```hcl blocks are
# emitted by the rhizz preprocessor.
additional-css = ["css/rhizz.css"]

[preprocessor.rhizz]
command = "python3 /home/claw/rhizz/book/preprocessors/rhizz.py"
renderer = ["html"]