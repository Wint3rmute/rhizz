[package]
name = "rhizz-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
hcl-rs  = "0.19.6"
anyhow  = "1"
serde   = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
serde_json = "1"
walkdir = "2"

[[bench]]
name = "compile"
harness = false
