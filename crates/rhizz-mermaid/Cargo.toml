[package]
name = "rhizz-mermaid"
version = "0.1.0"
edition = "2024"

[features]
default = ["png"]
png = ["mermaid-rs-renderer/png", "dep:resvg", "dep:usvg"]

[dependencies]
rhizz-core = { path = "../rhizz-core" }
mermaid-rs-renderer = { version = "0.2.0", default-features = false }
anyhow = "1.0"
resvg = { version = "0.46", optional = true }
usvg = { version = "0.46", optional = true }

[dev-dependencies]
walkdir = "2"
