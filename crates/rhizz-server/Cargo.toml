[package]
name = "rhizz-server"
version = "0.1.0"
edition = "2024"
description = "HTTP server library for the rhizz web editor (used by `rhizz web`)"
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.5", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# Transitive dependency of `rmcp`; declared directly only to use its
# `JsonSchema` derive for the MCP tool argument struct. It adds nothing new to
# the dependency graph.
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
