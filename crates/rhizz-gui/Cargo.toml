[package]
name = "rhizz-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rhizz-gui"
path = "src/main.rs"

[dependencies]
rhizz-core          = { path = "../rhizz-core" }
rhizz-dot           = { path = "../rhizz-dot" }
eframe              = "0.35"
egui                = "0.35"
layout-rs           = "0.1.3"
notify              = "8"
walkdir             = "2"
anyhow              = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
