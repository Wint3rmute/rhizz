[package]
name = "rhizz-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rhizz-gui"
path = "src/main.rs"

[dependencies]
rhizz-core    = { path = "../rhizz-core" }
rhizz-mermaid = { path = "../rhizz-mermaid" }
eframe        = "0.31"
egui          = "0.31"
image         = { version = "0.25", default-features = false, features = ["png"] }
notify        = "6"
walkdir       = "2"
anyhow        = "1"
