[package]
name = "rhizome-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for rhizome-core"
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# Larger WASM packages, but this works
# from android's termux environment.
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhizome-core         = { path = "../rhizome-core" }
serde              = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json         = "1"
wasm-bindgen       = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
