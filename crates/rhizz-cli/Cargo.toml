[package]
name = "rhizz-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rhizz"
path = "src/main.rs"

[dependencies]
rhizz-core          = { path = "../rhizz-core" }
rhizz-server        = { path = "../rhizz-server" }
anyhow              = "1"
walkdir             = "2"
serde               = { version = "1", features = ["derive"] }
clap                = { version = "4", features = ["derive", "env"] }
owo-colors          = "4"
serde_json          = "1"
notify              = "8"
ctrlc               = "3"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
similar             = "3.2"
tokio               = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
