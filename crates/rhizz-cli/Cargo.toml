[package]
name = "rhizz-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rhizz"
path = "src/main.rs"

[dependencies]
rhizz-core          = { path = "../rhizz-core" }
rhizz-dot           = { path = "../rhizz-dot" }
rhizz-mermaid       = { path = "../rhizz-mermaid" }
anyhow              = "1"
walkdir             = "2"
serde               = { version = "1", features = ["derive"] }
clap                = { version = "4", features = ["derive"] }
owo-colors          = "4"
serde_json          = "1"
notify              = "6"
ctrlc               = "3"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
