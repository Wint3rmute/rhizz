[package]
name = "rhizz-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for rhizz-core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhizz-core   = { path = "../rhizz-core" }
serde_json   = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
