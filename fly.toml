# fly.toml app configuration file generated for rhizz on 2026-08-30T12:02:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rhizz'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  RHIZZ_ADDR = '0.0.0.0:8080'
  RHIZZ_DATA_DIR = '/data'
  RUST_LOG = 'info'

[[mounts]]
  source = 'rhizz_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
