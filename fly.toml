# fly.toml app configuration file generated for rhizz on 2026-08-30T12:02:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rhizz'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  # Build-time arguments for the frontend build inside the image.
  #
  # VITE_RHIZZ_DEPLOYMENT selects the frontend's Sentry mode (see
  # web/src/hooks.client.ts): "prod" sends errors to Sentry through the server
  # tunnel, anything else sends nothing. It must be here, not in `fly secrets`:
  # Vite inlines `VITE_*` variables when it bundles, and the bundle is compiled
  # into the `rhizz` binary by rhizz-server's build.rs, all while the image is
  # being built, before any runtime secret exists.
  #
  # Note: changing this invalidates the frontend build layer's cache, so the
  # next deploy rebuilds it rather than reusing it.
  [build.args]
    VITE_RHIZZ_DEPLOYMENT = 'prod'

[env]
  RHIZZ_ADDR = '0.0.0.0:8080'
  RUST_LOG = 'info'

[[mounts]]
  source = 'rhizz_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
