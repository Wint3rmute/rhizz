<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>rhizz-logo preview</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f4f5; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; width: 220px; }
  .card.dark { background: #111; color: #eee; }
  .card img { width: 100%; height: auto; display: block; }
  .card.dark img { filter: invert(1); }
  .card.wide { width: 460px; }
  .row { display: flex; gap: 8px; align-items: end; margin-top: 8px; }
  .row img { width: auto; }
  small { color: #888; }
</style>
</head>
<body>
<h1>rhizz-logo preview</h1>
<p>Regenerate with <code>node src/generate.mjs --variant rhizome --seed-end 6 --outdir renders</code>, then reload. Dark cards + tiny sizes test legibility.</p>
<div class="grid" id="g"></div>
<script type="module">
  const variants = ["rhizome", "paper-rhizome", "plateau", "mesh"];
  const g = document.getElementById("g");
  // list renders dir manually — keep in sync with what you generate
  const files = [];
  for (const v of variants) for (let s = 1; s <= 6; s++) files.push(`${v}-${String(s).padStart(3, "0")}.svg`);
  const lockups = ["lockup-001.svg", "lockup-001-text.svg", "lockup-002.svg", "paper-rhizome-hole.svg"];
  for (const f of lockups) files.push(f);
  for (const f of files) {
    for (const dark of [false, true]) {
      const card = document.createElement("div");
      card.className = "card" + (dark ? " dark" : "");
      card.innerHTML = `<img src="renders/${f}" onerror="this.parentNode.remove()"><small>${f}</small>
        <div class="row"><img src="renders/${f}" width="32"><img src="renders/${f}" width="16"></div>`;
      g.appendChild(card);
    }
  }
</script>
</body>
</html>
